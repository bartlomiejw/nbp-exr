name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - name: PHP_CodeSniffer (WPCS + PHPCompatibilityWP)
        run: vendor/bin/phpcs

      - name: PHPStan
        run: composer analyse -- --no-progress --error-format=github

      - name: PHPUnit
        run: vendor/bin/phpunit

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Plugin zip
    needs: [php, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build distributable zip
        run: bash bin/build-zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nbp-exr
          path: build/nbp-exr-*.zip
          if-no-files-found: error
